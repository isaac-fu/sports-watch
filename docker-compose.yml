services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: courtside
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: courtside-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtside -d courtside"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://courtside:courtside-local@db:5432/courtside
      SPORTS_DATA_PROVIDER: ${SPORTS_DATA_PROVIDER:-mock}
      BALLDONTLIE_API_KEY: ${BALLDONTLIE_API_KEY:-}
      BALLDONTLIE_BASE_URL: ${BALLDONTLIE_BASE_URL:-https://api.balldontlie.io/v1}
      NEWS_DATA_PROVIDER: ${NEWS_DATA_PROVIDER:-mock}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      NEWS_API_BASE_URL: ${NEWS_API_BASE_URL:-https://newsapi.org/v2}
      STATS_DATA_PROVIDER: ${STATS_DATA_PROVIDER:-mock}
      ALERT_WORKER_TOKEN: ${ALERT_WORKER_TOKEN:-local-worker-token}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  alert-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "workers/alert-worker.mjs"]
    environment:
      ALERT_API_BASE_URL: http://web:3000
      ALERT_POLL_INTERVAL_MS: ${ALERT_POLL_INTERVAL_MS:-30000}
      ALERT_WORKER_TOKEN: ${ALERT_WORKER_TOKEN:-local-worker-token}
    depends_on:
      - web
    restart: unless-stopped
  data-sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "workers/data-sync-worker.mjs"]
    environment:
      DATA_SYNC_API_BASE_URL: http://web:3000
      DATA_SYNC_INTERVAL_MS: ${DATA_SYNC_INTERVAL_MS:-900000}
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
