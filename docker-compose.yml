services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: courtside
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: courtside-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtside -d courtside"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://courtside:courtside-local@db:5432/courtside
      SPORTS_DATA_PROVIDER: ${SPORTS_DATA_PROVIDER:-mock}
      CATALOG_DATA_PROVIDER: ${CATALOG_DATA_PROVIDER:-mock}
      BALLDONTLIE_API_KEY: ${BALLDONTLIE_API_KEY:-}
      BALLDONTLIE_BASE_URL: ${BALLDONTLIE_BASE_URL:-https://api.balldontlie.io/v1}
      NEWS_DATA_PROVIDER: ${NEWS_DATA_PROVIDER:-rss-newsapi}
      NBA_RSS_FEED_URLS: ${NBA_RSS_FEED_URLS:-https://www.espn.com/espn/rss/nba/news,https://www.cbssports.com/rss/headlines/nba}
      RSS_FETCH_TIMEOUT_MS: ${RSS_FETCH_TIMEOUT_MS:-10000}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      NEWS_API_BASE_URL: ${NEWS_API_BASE_URL:-https://newsapi.org/v2}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      CATCH_UP_WEB_SEARCH: ${CATCH_UP_WEB_SEARCH:-selective}
      CATCH_UP_SEARCH_DOMAINS: ${CATCH_UP_SEARCH_DOMAINS:-nba.com,espn.com,cbssports.com,sports.yahoo.com,si.com,basketball-reference.com}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      EMAIL_DATA_PROVIDER: ${EMAIL_DATA_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Sports Watch <verify@your-domain.com>}
      EMAIL_VERIFICATION_TTL_MS: ${EMAIL_VERIFICATION_TTL_MS:-86400000}
      STATS_DATA_PROVIDER: ${STATS_DATA_PROVIDER:-mock}
      NBA_API_SERVICE_URL: http://nba-api:8000
      NBA_API_SERVICE_TIMEOUT_MS: ${NBA_API_SERVICE_TIMEOUT_MS:-120000}
      ALERT_WORKER_TOKEN: ${ALERT_WORKER_TOKEN:-local-worker-token}
      DATA_SYNC_WORKER_TOKEN: ${DATA_SYNC_WORKER_TOKEN:-local-sync-token}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
      nba-api:
        condition: service_healthy
    restart: unless-stopped
  nba-api:
    build:
      context: ./nba-api-service
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      NBA_API_CACHE_TTL_SECONDS: ${NBA_API_CACHE_TTL_SECONDS:-900}
      NBA_API_REQUEST_TIMEOUT_SECONDS: ${NBA_API_REQUEST_TIMEOUT_SECONDS:-30}
      NBA_API_MIN_REQUEST_INTERVAL_SECONDS: ${NBA_API_MIN_REQUEST_INTERVAL_SECONDS:-0.7}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  alert-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "workers/alert-worker.mjs"]
    environment:
      ALERT_API_BASE_URL: http://web:3000
      ALERT_POLL_INTERVAL_MS: ${ALERT_POLL_INTERVAL_MS:-30000}
      ALERT_WORKER_TOKEN: ${ALERT_WORKER_TOKEN:-local-worker-token}
    depends_on:
      - web
    restart: unless-stopped
  data-sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "workers/data-sync-worker.mjs"]
    environment:
      DATA_SYNC_API_BASE_URL: http://web:3000
      DATA_SYNC_INTERVAL_MS: ${DATA_SYNC_INTERVAL_MS:-900000}
      DATA_SYNC_WORKER_TOKEN: ${DATA_SYNC_WORKER_TOKEN:-local-sync-token}
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
